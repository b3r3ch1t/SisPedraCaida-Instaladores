name: Runner Windows - diagnóstico (instaladores)

# Confere se o runner [self-hosted, windows, instaladores] está pronto para empacotar os instaladores
# do CI de prod (PRD-INSTPROD-01): SDK do global.json, pwsh, git, Inno Setup 6 com pt-BR,
# LongPathsEnabled, comprimento do caminho dos worktrees e os DOIS payloads do PrintMonitor (QZ Tray e
# driver da Bematech), cada um com o hash conferido.
#
# Rode DEPOIS de registrar o runner e ANTES de ligar a variável INSTALADORES_WINDOWS — e de novo a
# cada troca de SDK, Inno ou versão de um dos payloads. O script roda como a conta do serviço do runner, que é
# o que importa: ferramenta instalada "por usuário" por quem preparou a máquina não existe para ela.
# Runbook: docs/RunnerWindowsInstaladores.md (neste repositório).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: diagnóstico
    runs-on: [self-hosted, windows, instaladores]
    timeout-minutes: 10
    env:
      PRINTMONITOR_PAYLOAD_DIR: ${{ vars.PRINTMONITOR_PAYLOAD_DIR }}
      # O driver da Bematech é OBRIGATÓRIO desde o PRD-PMTRAY-02 (sem ele o build do PrintMonitor
      # falha, não só sai sem o componente) — conferido aqui desde o PRD-INSTDEV-04.
      PRINTMONITOR_DRIVERS_PAYLOAD_DIR: ${{ vars.PRINTMONITOR_DRIVERS_PAYLOAD_DIR }}
      # O mesmo liga-desliga de caminho longo do job de empacotamento (instaladores-windows.yml).
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v5

      # SDK do global.json e projetos de src/ são do backend (o pior caso de caminho é medido com eles).
      - uses: actions/checkout@v5
        with:
          repository: b3r3ch1t/SisPedraCaida-Backend
          token: ${{ secrets.SISPEDRACAIDA_BACKEND_TOKEN }}
          ref: dev
          path: backend

      - name: Conferir pré-requisitos
        shell: pwsh
        run: ./scripts/runner-windows-diagnostico.ps1 -ExigirPayload

      # Mesmos testes que o job `testar` do instaladores-windows.yml roda antes de empacotar:
      # provam que git, worktree e hash funcionam COMO a conta do runner.
      - name: Testes do Empacotamento.psm1
        shell: pwsh
        run: ./installer/common/Invoke-TestesEmpacotamento.ps1
