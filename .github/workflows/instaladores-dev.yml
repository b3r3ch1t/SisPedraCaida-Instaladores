name: Instaladores Windows (dev)

# Regera TefAgentSetup, PrintMonitorSetup, TotemSetup e MigracaoGalileuSetup a partir da `dev` do backend
# (PRD-INSTDEV-02; o migrador desde o PRD-MGGINST-01). A lista vem do manifesto, não deste arquivo.
#
# SOMENTE MANUAL DESDE 30/10/2026: o push na `dev` não empacota mais (nem aqui nem no backend, junto com
# o publish das imagens da `dev`). Rodar pela aba Actions ou `gh workflow run instaladores-dev.yml --ref dev`.
#
# O disparo manual do lado do backend — `instaladores-dev.yml` de lá — não passa por aqui: ele chama o
# `instaladores-windows.yml` deste repositório direto, por
# `gh workflow run --ref dev -f canal=dev -f sha=<sha do backend>`.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit do BACKEND a empacotar. Vazio = HEAD da dev do backend.'
        type: string
        required: false
        default: ''

# ⚠️ OBRIGATÓRIO: o reusable pede `contents: write` (release dev-latest), e o GITHUB_TOKEN deste
# repositório nasce SÓ DE LEITURA (default_workflow_permissions = read). Sem conceder aqui, o GitHub
# recusa o run inteiro no startup (`startup_failure`) — mesmo com o job pulado pelo `if`. O backend não
# tinha isso porque lá o padrão é escrita.
permissions:
  contents: write

jobs:
  instaladores:
    # Liga-desliga do épico (D6): sem o runner registrado o job ficaria na fila e o Actions o
    # cancelaria em 24 h. O `if` fica AQUI, no chamador: dentro do reusable marcaria os jobs internos
    # como `skipped` com o workflow ainda "executado", em vez de o run inteiro aparecer como pulado.
    if: ${{ vars.INSTALADORES_WINDOWS == 'true' }}
    uses: ./.github/workflows/instaladores-windows.yml
    with:
      canal: dev
      # Vazio = HEAD da dev do backend, resolvido pelo job `matriz` (o SHA deste repositório não é um
      # commit do backend, então NÃO há fallback para github.sha aqui, ao contrário do backend).
      sha: ${{ inputs.sha }}
    secrets: inherit
